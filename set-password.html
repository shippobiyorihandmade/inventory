<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="favicon.png">
<title>パスワード設定 — ハンドメイド在庫管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#faf8f5;--sf:#fff;--sf2:#f3efe9;--bd:#e5ddd0;--tx:#2c2416;--tx2:#7a6e60;--ac:#c0622a;--ac2:#e8a87c;--ac3:#4a7c6f;--wn:#d4622a;--wb:#fff3ed;--ok:#4a7c6f;--ob:#edf5f3;--r:12px;--sh:0 2px 12px rgba(44,36,22,.08);--shl:0 8px 32px rgba(44,36,22,.15);}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow-x:hidden;}
body{font-family:'Hiragino Sans','Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#fdf9f5 0%,#f5ede0 50%,#ede0d0 100%);z-index:-1;}

.card{background:var(--sf);border-radius:20px;padding:36px 32px;max-width:400px;width:100%;box-shadow:var(--shl);border:1px solid var(--bd);}

.logo{text-align:center;margin-bottom:28px;}
.logo-icon{font-size:40px;margin-bottom:8px;}
.logo-title{font-size:18px;font-weight:700;color:var(--tx);}
.logo-title span{color:var(--ac);}

h2{font-size:16px;font-weight:700;margin-bottom:6px;text-align:center;}
.desc{font-size:13px;color:var(--tx2);text-align:center;margin-bottom:24px;line-height:1.7;}

label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:4px;letter-spacing:.04em;}
.input-wrap{position:relative;margin-bottom:14px;}
input[type="password"]{width:100%;padding:11px 40px 11px 13px;border:1.5px solid var(--bd);border-radius:10px;font-family:inherit;font-size:14px;background:var(--sf);color:var(--tx);transition:border-color .2s;-webkit-appearance:none;}
input[type="password"]:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(192,98,42,.1);}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--tx2);padding:4px;}

.strength{height:4px;border-radius:2px;background:var(--bd);margin-top:6px;overflow:hidden;}
.strength-bar{height:100%;border-radius:2px;transition:width .3s,background .3s;width:0;}
.strength-label{font-size:11px;color:var(--tx2);margin-top:4px;}

.btn{display:block;width:100%;padding:13px;border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px;}
.bp{background:linear-gradient(135deg,var(--ac),#d4733a);color:#fff;box-shadow:0 4px 16px rgba(192,98,42,.3);}
.bp:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(192,98,42,.4);}
.bp:disabled{opacity:.6;cursor:not-allowed;transform:none;}

.msg{border-radius:10px;padding:11px 14px;font-size:13px;margin-top:14px;display:none;line-height:1.6;}
.msg.ok{background:var(--ob);color:var(--ok);display:block;}
.msg.err{background:#fde8e8;color:#c04a4a;display:block;}

.loading{text-align:center;padding:40px 20px;display:none;}
.loading.show{display:block;}
.spinner{width:36px;height:36px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}

.form-area{display:none;}
.form-area.show{display:block;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon">🧵</div>
    <div class="logo-title">ハンドメイド<span>在庫管理</span></div>
  </div>

  <!-- ローディング -->
  <div class="loading show" id="loading">
    <div class="spinner"></div>
    <p style="font-size:13px;color:var(--tx2)">確認中...</p>
  </div>

  <!-- パスワード設定フォーム -->
  <div class="form-area" id="formArea">
    <h2 id="formTitle">パスワードを設定してください</h2>
    <p class="desc" id="formDesc">次回からのログインに使うパスワードを設定するにゃ🐾<br>Googleログインを使う方は設定不要です。</p>

    <div>
      <label>新しいパスワード</label>
      <div class="input-wrap">
        <input type="password" id="pw1" placeholder="8文字以上" oninput="checkStrength()">
        <button class="toggle-pw" type="button" onclick="togglePw('pw1', this)">👁</button>
      </div>
      <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div style="margin-top:14px">
      <label>パスワード（確認）</label>
      <div class="input-wrap">
        <input type="password" id="pw2" placeholder="もう一度入力してください">
        <button class="toggle-pw" type="button" onclick="togglePw('pw2', this)">👁</button>
      </div>
    </div>

    <button class="btn bp" id="submitBtn" onclick="setPassword()">パスワードを設定する</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- エラー表示 -->
  <div id="errorArea" style="display:none;text-align:center">
    <div style="font-size:36px;margin-bottom:12px">😿</div>
    <h2 style="margin-bottom:8px">リンクが無効です</h2>
    <p style="font-size:13px;color:var(--tx2);line-height:1.7">このリンクは有効期限切れか、すでに使用済みです。<br>パスワードのリセットは<a href="pro.html" style="color:var(--ac)">ログインページ</a>から再度お試しください。</p>
  </div>
</div>

<script>
var SB_URL = 'https://zllquptbaekezaxvysfb.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsbHF1cHRiYWVrZXpheHZ5c2ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDcyMjMsImV4cCI6MjA5MjM4MzIyM30.zfiTyR_O07rOoQDnsF_hjX1adsUL5nWdZ9GSZX8cMaM';
var sbClient = null;

window.addEventListener('load', async function() {
  sbClient = supabase.createClient(SB_URL, SB_KEY, {
    auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });

  // URLのクエリパラメータからtoken_hashとtypeを取得
  var params = new URLSearchParams(window.location.search);
  var tokenHash = params.get('token_hash');
  var type = params.get('type');

  if (tokenHash && type) {
    var { data, error } = await sbClient.auth.verifyOtp({
      token_hash: tokenHash,
      type: type,
    });

    if (error || !data.session) {
      document.getElementById('loading').classList.remove('show');
      document.getElementById('errorArea').style.display = 'block';
      return;
    }

    document.getElementById('loading').classList.remove('show');
    document.getElementById('formArea').classList.add('show');

    if (type === 'recovery') {
      document.getElementById('formTitle').textContent = 'パスワードを再設定してください';
      document.getElementById('formDesc').textContent = '新しいパスワードを入力してください🐾';
    }
    return;
  }

  // クエリパラメータなし → 既存セッション確認
  var { data, error } = await sbClient.auth.getSession();

  if (error || !data.session) {
    document.getElementById('loading').classList.remove('show');
    document.getElementById('errorArea').style.display = 'block';
    return;
  }

  document.getElementById('loading').classList.remove('show');
  document.getElementById('formArea').classList.add('show');
});

function togglePw(id, btn) {
  var input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

function checkStrength() {
  var pw = document.getElementById('pw1').value;
  var bar = document.getElementById('strengthBar');
  var label = document.getElementById('strengthLabel');
  if (!pw) { bar.style.width = '0'; label.textContent = ''; return; }

  var score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  var colors = ['#e05555','#e08855','#e0c055','#7ab855','#4a7c6f'];
  var labels = ['とても弱い','弱い','普通','強い','とても強い'];
  var widths = ['20%','40%','60%','80%','100%'];
  var idx = Math.min(score - 1, 4);
  if (idx < 0) idx = 0;
  bar.style.width = widths[idx];
  bar.style.background = colors[idx];
  label.textContent = labels[idx];
}

async function setPassword() {
  var pw1 = document.getElementById('pw1').value;
  var pw2 = document.getElementById('pw2').value;
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');

  msg.className = 'msg';
  msg.style.display = 'none';

  if (!pw1) { showMsg('err', 'パスワードを入力してください'); return; }
  if (pw1.length < 8) { showMsg('err', '8文字以上で入力してください'); return; }
  if (pw1 !== pw2) { showMsg('err', 'パスワードが一致していません'); return; }

  btn.disabled = true;
  btn.textContent = '設定中...';

  var { error } = await sbClient.auth.updateUser({ password: pw1 });

  if (error) {
    showMsg('err', 'エラー: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'パスワードを設定する';
    return;
  }

  showMsg('ok', '✅ パスワードを設定しました！ログインページに移動します...');
  setTimeout(function() {
    window.location.href = 'pro.html';
  }, 2000);
}

function showMsg(type, text) {
  var msg = document.getElementById('msg');
  msg.className = 'msg ' + type;
  msg.textContent = text;
}
</script>
</body>
</html>
